repos:
  - repo: https://github.com/mrsimonemms/pre-commit-hooks
    rev: v1.2.1
    hooks:
      - id: license-eye
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
      - id: check-json
      - id: check-yaml
        # hack: generated; cloud-config.yaml is a Go template whose conditional
        # lines aren't YAML until rendered (the Go tests parse the rendered output)
        exclude: ^(hack|pkg/hetzner/cloud-config\.yaml$)
        args:
          - --allow-multiple-documents
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: mdtoc
        name: mdtoc
        description: Regenerate the README table of contents
        language: golang
        additional_dependencies:
          - sigs.k8s.io/mdtoc@v1.4.0
        entry: mdtoc --inplace
        files: ^README\.md$
