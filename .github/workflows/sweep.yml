name: Sweep leaked e2e resources
# Deletes Hetzner servers, volumes, SSH keys and primary IPs labelled
# machineId=test-* (plus auto-created orphaned primary IPs) that are older than an
# hour, i.e. left behind by e2e runs whose cleanup never ran (for example a
# cancelled workflow). Primary IPs still assigned to a deleted server are
# unassigned first.
on:
  schedule:
    - cron: 17 * * * *
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deliberately NOT "Hetzner E2E": that environment requires manual approval,
    # which would block every scheduled run. This one must have no required
    # reviewers, and holds its own HCLOUD_TOKEN secret (a project token that can
    # list and delete servers, volumes and SSH keys). Restrict it to the main
    # branch under the environment's deployment branch rules.
    environment: Hetzner Sweeper
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hetznercloud/setup-hcloud@28cdd3fc4a4a8013e86d57c7254be72df92fcc02 # v2.0.1

      - name: Delete stale e2e resources
        run: ./hack/hcloud_sweep.sh
