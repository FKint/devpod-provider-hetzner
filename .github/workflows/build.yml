name: Build
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # All branches, so stacked PRs (whose base is another feature branch) get e2e too
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
# Cancelling a run mid `provider create` can leak Hetzner resources if the
# always() cleanup outlasts the cancellation grace period; sweep.yml deletes
# test-* resources older than an hour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch-depth is required

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for pre-commit to be able scan history

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: go install ./...

      - name: go-vet
        run: go vet -v ./...

      - name: go-test
        run: go test -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      # Inlined from pre-commit/action (v3.0.1), which still uses actions/cache@v4 on Node 20
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  e2e:
    # Only spend money on real servers once the cheap jobs have passed
    needs:
      - commitlint
      - test
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets and approval gating live in this environment
    environment: Hetzner E2E
    # Fork PRs and Dependabot PRs have no access to secrets and must never create billable resources.
    # Non-PR events (tag pushes, manual runs) always run e2e so releases cannot skip it.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DISK_IMAGE: docker-ce
      DISK_SIZE: "30"
      MACHINE_ID: test-${{ github.run_id }}
      MACHINE_FOLDER: ${{ github.workspace }}/.ssh
      # The e2e tests deliberately use cpx22, which is not the provider default (cx33).
      # NOTE: Hetzner retires server types over time; if cpx22 is deprecated or
      # unavailable in REGION, pick a current small type and update this value.
      MACHINE_TYPE: "cpx22"
      REGION: "nbg1"
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork PRs are excluded by the job-level `if`, so missing secrets here
      # are a misconfiguration and must fail rather than silently skip e2e.
      - name: Check e2e secrets
        run: |
          if [ -z "${HCLOUD_TOKEN}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::HCLOUD_TOKEN and SSH_KEY secrets are required to run e2e"
            exit 1
          fi

      - uses: hetznercloud/setup-hcloud@28cdd3fc4a4a8013e86d57c7254be72df92fcc02 # v2.0.1

      - name: Set up SSH keys
        run: |
          mkdir -p "${MACHINE_FOLDER}"
          # Strip CRs in case the secret was pasted with CRLF line endings
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > "${MACHINE_FOLDER}/sshkey"
          chmod 600 "${MACHINE_FOLDER}/sshkey"
          # Derive the public key so it can never drift from the private key
          ssh-keygen -y -f "${MACHINE_FOLDER}/sshkey" > "${MACHINE_FOLDER}/sshkey.pub"
          ls -la "${MACHINE_FOLDER}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go build -o provider .

      - name: Create command
        run: ./provider create

      - name: Status is Running
        run: ./hack/e2e/assert_status.sh Running

      - name: Run command
        run: ./hack/e2e/assert_hostname.sh

      # Directly before the stop, so the data is still unflushed when it happens
      - name: Write unflushed data
        run: ./hack/e2e/graceful_stop.sh before

      - name: Stop command
        run: ./provider stop

      - name: Status is Stopped
        run: ./hack/e2e/assert_status.sh Stopped

      - name: Start command
        run: ./provider start

      - name: Unflushed data survived the stop
        run: ./hack/e2e/graceful_stop.sh after

      - name: Status is Running again
        run: ./hack/e2e/assert_status.sh Running

      - name: Run command
        run: ./hack/e2e/assert_hostname.sh

      - name: Delete command
        run: ./provider delete

      - name: Status is NotFound
        run: ./hack/e2e/assert_status.sh NotFound

      # This can fail due to resources failing to detach properly
      - name: Ensure destruction
        if: ${{ always() }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./hack/hcloud_destroy.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      is_tag: ${{ steps.version.outputs.is_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go version

      - name: Generate version info
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ];
          then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "version=development" >> "$GITHUB_OUTPUT"
          fi

          echo "commit_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "gitRepo=github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Compile binaries
        run: ./hack/build.sh
        env:
          GIT_COMMIT: ${{ steps.version.outputs.commit_id }}
          GIT_REPO: ${{ steps.version.outputs.gitRepo }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # provider.yaml needs the Hetzner API, so it is generated in publish
          SKIP_PROVIDER_YAML: "true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    needs:
      - build
      - commitlint
      - e2e
      - test
    if: needs.build.outputs.is_tag == 'true'
    # Holds a READ-ONLY Hetzner API token (secret HCLOUD_TOKEN), used only to generate provider.yaml
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Queries the Hetzner API for locations and server types (read-only token is enough)
      - name: Generate provider.yaml
        run: go run ./hack/provider "${{ needs.build.outputs.version }}" > dist/provider.yaml
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          files: dist/*
