name: Build
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
# TODO: cancelling a run mid `provider create` can leak Hetzner resources if the
# always() cleanup outlasts the cancellation grace period. Add a scheduled
# workflow that deletes test-* servers/volumes/SSH keys older than ~1h, or stop
# cancelling e2e runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch-depth is required

      - uses: wagoid/commitlint-github-action@v6

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for pre-commit to be able scan history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: go install ./...

      - name: go-vet
        run: go vet -v ./...

      - name: go-test
        run: go test -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

      - uses: pre-commit/action@v3.0.1

  e2e:
    # Only spend money on real servers once the cheap jobs have passed
    needs:
      - commitlint
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and approval gating live in this environment
    environment: Hetzner E2E
    # Fork PRs have no access to secrets and must never create billable resources
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DISK_IMAGE: docker-ce
      DISK_SIZE: "30"
      MACHINE_ID: test-${{ github.run_id }}
      MACHINE_FOLDER: ${{ github.workspace }}/.ssh
      MACHINE_TYPE: "cpx22"
      REGION: "nbg1"
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Fork PRs are excluded by the job-level `if`, so missing secrets here
      # are a misconfiguration and must fail rather than silently skip e2e.
      - name: Check e2e secrets
        run: |
          if [ -z "${HCLOUD_TOKEN}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::HCLOUD_TOKEN and SSH_KEY secrets are required to run e2e"
            exit 1
          fi

      - uses: hetznercloud/setup-hcloud@v1

      - name: Set up SSH keys
        run: |
          mkdir -p "${MACHINE_FOLDER}"
          # Strip CRs in case the secret was pasted with CRLF line endings
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > "${MACHINE_FOLDER}/sshkey"
          chmod 600 "${MACHINE_FOLDER}/sshkey"
          # Derive the public key so it can never drift from the private key
          ssh-keygen -y -f "${MACHINE_FOLDER}/sshkey" > "${MACHINE_FOLDER}/sshkey.pub"
          ls -la "${MACHINE_FOLDER}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o provider .

      - name: Create command
        run: ./provider create

      - name: Run command
        env:
          COMMAND: hostname
        run: |
          set -o pipefail
          ./provider command | grep -F -- "${MACHINE_ID}"

      - name: Stop command
        run: ./provider stop

      - name: Start command
        run: ./provider start

      - name: Run command
        env:
          COMMAND: hostname
        run: |
          set -o pipefail
          ./provider command | grep -F -- "${MACHINE_ID}"

      - name: Delete command
        run: ./provider delete

      # This can fail due to resources failing to detach properly
      - name: Ensure destruction
        if: ${{ always() }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./hack/hcloud_destroy.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_tag: ${{ steps.branch-name.outputs.is_tag }}
    env:
      # Used to get default HCloud values
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go version

      - name: Get branch names
        id: branch-name
        uses: tj-actions/branch-names@v8
        with:
          strip_tag_prefix: v

      - name: Generate version info
        id: version
        run: |
          if [ "${{ steps.branch-name.outputs.is_tag }}" = "true"  ];
          then
            echo "version=${{ steps.branch-name.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=development" >> "$GITHUB_OUTPUT"
          fi

          echo "commit_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "gitRepo=github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Compile binaries
        run: ./hack/build.sh
        env:
          GIT_COMMIT: ${{ steps.version.outputs.commit_id }}
          GIT_REPO: ${{ steps.version.outputs.gitRepo }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    needs:
      - build
      - commitlint
      - e2e
      - test
    if: needs.build.outputs.is_tag == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v4

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          files: dist/*
