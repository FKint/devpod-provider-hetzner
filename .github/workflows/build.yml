name: Build
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
# TODO: cancelling a run mid `provider create` can leak Hetzner resources if the
# always() cleanup outlasts the cancellation grace period. Add a scheduled
# workflow that deletes test-* servers/volumes/SSH keys older than ~1h, or stop
# cancelling e2e runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # fetch-depth is required

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Required for pre-commit to be able scan history

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: go install ./...

      - name: go-vet
        run: go vet -v ./...

      - name: go-test
        run: go test -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  e2e:
    # Only spend money on real servers once the cheap jobs have passed
    needs:
      - commitlint
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and approval gating live in this environment
    environment: Hetzner E2E
    # Fork PRs and Dependabot PRs have no access to secrets and must never create billable resources.
    # Non-PR events (tag pushes, manual runs) always run e2e so releases cannot skip it.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DISK_IMAGE: docker-ce
      DISK_SIZE: "30"
      MACHINE_ID: test-${{ github.run_id }}
      MACHINE_FOLDER: ${{ github.workspace }}/.ssh
      # The e2e tests deliberately use cpx22, which is not the provider default (cx32).
      # NOTE: Hetzner retires server types over time; if cpx22 is deprecated or
      # unavailable in REGION, pick a current small type and update this value.
      MACHINE_TYPE: "cpx22"
      REGION: "nbg1"
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fork PRs are excluded by the job-level `if`, so missing secrets here
      # are a misconfiguration and must fail rather than silently skip e2e.
      - name: Check e2e secrets
        run: |
          if [ -z "${HCLOUD_TOKEN}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::HCLOUD_TOKEN and SSH_KEY secrets are required to run e2e"
            exit 1
          fi

      - uses: hetznercloud/setup-hcloud@4ff9bbeda4053fb69dd7fa1fcbdfcce7e648bf33 # v1

      - name: Set up SSH keys
        run: |
          mkdir -p "${MACHINE_FOLDER}"
          # Strip CRs in case the secret was pasted with CRLF line endings
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > "${MACHINE_FOLDER}/sshkey"
          chmod 600 "${MACHINE_FOLDER}/sshkey"
          # Derive the public key so it can never drift from the private key
          ssh-keygen -y -f "${MACHINE_FOLDER}/sshkey" > "${MACHINE_FOLDER}/sshkey.pub"
          ls -la "${MACHINE_FOLDER}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go build -o provider .

      - name: Create command
        run: ./provider create

      - name: Run command
        env:
          COMMAND: hostname
        run: |
          set -o pipefail
          ./provider command | grep -F -- "${MACHINE_ID}"

      - name: Stop command
        run: ./provider stop

      - name: Start command
        run: ./provider start

      - name: Run command
        env:
          COMMAND: hostname
        run: |
          set -o pipefail
          ./provider command | grep -F -- "${MACHINE_ID}"

      - name: Delete command
        run: ./provider delete

      # This can fail due to resources failing to detach properly
      - name: Ensure destruction
        if: ${{ always() }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./hack/hcloud_destroy.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_tag: ${{ steps.version.outputs.is_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go version

      - name: Generate version info
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ];
          then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "version=development" >> "$GITHUB_OUTPUT"
          fi

          echo "commit_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "gitRepo=github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Compile binaries
        run: ./hack/build.sh
        env:
          GIT_COMMIT: ${{ steps.version.outputs.commit_id }}
          GIT_REPO: ${{ steps.version.outputs.gitRepo }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # provider.yaml needs the Hetzner API, so it is generated in publish
          SKIP_PROVIDER_YAML: "true"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    needs:
      - build
      - commitlint
      - e2e
      - test
    if: needs.build.outputs.is_tag == 'true'
    # Holds a READ-ONLY Hetzner API token (secret HCLOUD_TOKEN), used only to generate provider.yaml
    environment: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # Queries the Hetzner API for locations and server types (read-only token is enough)
      - name: Generate provider.yaml
        run: go run ./hack/provider "${{ needs.build.outputs.version }}" > dist/provider.yaml
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@162edb95b1a57c11bf799b62984a91983395c738 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          files: dist/*
